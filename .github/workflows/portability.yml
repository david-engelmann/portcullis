name: Portability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.91.1"
          components: rustfmt, clippy
      - name: Run the local gate on macOS
        run: cargo test
      - name: Run the codepoint scan on macOS
        run: cargo run --bin codepoint_scan
      - name: Check the formatting on macOS
        run: cargo fmt --check
      - name: Run the linter on macOS
        run: cargo clippy --all-targets -- -D warnings
      - name: Build the binding and run the smoke suite on macOS
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv-binding
        run: |
          python -m venv .venv-binding
          .venv-binding/bin/python -m pip install maturin==1.16.0 pytest==9.2.0
          .venv-binding/bin/maturin develop --manifest-path bindings/Cargo.toml
          .venv-binding/bin/python -m pytest tests/test_binding_smoke.py

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.91.1"
          components: rustfmt, clippy
      - name: Run the local gate on Windows
        run: cargo test
      - name: Run the codepoint scan on Windows
        run: cargo run --bin codepoint_scan
      - name: Check the formatting on Windows
        run: cargo fmt --check
      - name: Run the linter on Windows
        run: cargo clippy --all-targets -- -D warnings
      - name: Build the binding and run the smoke suite on Windows
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv-binding
        run: |
          python -m venv .venv-binding
          .venv-binding\Scripts\python.exe -m pip install maturin==1.16.0 pytest==9.2.0
          .venv-binding\Scripts\maturin.exe develop --manifest-path bindings/Cargo.toml
          .venv-binding\Scripts\python.exe -m pytest tests/test_binding_smoke.py
