name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.91.1"
          components: rustfmt, clippy
      - name: Verify manifest version parity and tag match
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          bind_cargo = tomllib.loads(pathlib.Path("bindings/Cargo.toml").read_text(encoding="utf-8"))
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          init_py = pathlib.Path("python/portcullis/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'^__version__\s*=\s*"([^"]+)"', init_py, re.M)
          assert m is not None, "missing __version__ in python/portcullis/__init__.py"
          ver = cargo["package"]["version"]
          assert bind_cargo["package"]["version"] == ver, "bindings/Cargo.toml version mismatch"
          assert pyproject["project"]["version"] == ver, "pyproject.toml version mismatch"
          assert m.group(1) == ver, "__init__.py __version__ mismatch"
          if os.environ.get("REF_TYPE") == "tag":
              expected = f"v{ver}"
              actual = os.environ.get("REF_NAME", "")
              assert actual == expected, f"tag {actual} does not match Cargo.toml {expected}"
          PY
      - name: Run the local gate
        run: cargo test
      - name: Run the codepoint scan
        run: cargo run --bin codepoint_scan
      - name: Check the formatting
        run: cargo fmt --check
      - name: Run the linter
        run: cargo clippy --all-targets -- -D warnings
      - name: Verify crate packaging
        run: cargo package --locked -p portcullis
      - name: Build the Python binding and run the smoke suite
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv-binding
        run: |
          python -m venv .venv-binding
          .venv-binding/bin/python -m pip install maturin==1.16.0 pytest==9.2.0
          .venv-binding/bin/maturin develop --manifest-path bindings/Cargo.toml
          .venv-binding/bin/python -m pytest tests/test_binding_smoke.py

  binaries:
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.91.1"
          targets: ${{ matrix.target }}
      - name: Build release binary and package archive
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          ARCHIVE_KIND: ${{ matrix.archive }}
        shell: bash
        run: |
          cargo build --release --locked --bin portcullis --target "$TARGET_TRIPLE"
          python - <<'PY'
          import hashlib, os, pathlib, tarfile, tomllib, zipfile
          ver = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          target = os.environ["TARGET_TRIPLE"]
          kind = os.environ["ARCHIVE_KIND"]
          exe = "portcullis.exe" if "windows" in target else "portcullis"
          bin_path = pathlib.Path("target") / target / "release" / exe
          out_dir = pathlib.Path("release-staging")
          out_dir.mkdir(parents=True, exist_ok=True)
          stem = f"portcullis-v{ver}-{target}"
          if kind == "zip":
              archive_path = out_dir / f"{stem}.zip"
              with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                  zf.write(bin_path, arcname=exe)
                  zf.write("LICENSE", arcname="LICENSE")
                  zf.write("README.md", arcname="README.md")
          else:
              archive_path = out_dir / f"{stem}.tar.gz"
              with tarfile.open(archive_path, "w:gz") as tf:
                  tf.add(bin_path, arcname=exe)
                  tf.add("LICENSE", arcname="LICENSE")
                  tf.add("README.md", arcname="README.md")
          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          (out_dir / f"{archive_path.name}.sha256").write_text(f"{digest}  {archive_path.name}\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: release-staging/*

  wheels:
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.91.1"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          rust-toolchain: "1.91.1"
          args: --release --locked --out dist --manifest-path bindings/Cargo.toml
      - name: Verify wheel PEP 561 entries
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheels = list(pathlib.Path("dist").glob("portcullis-*.whl"))
          assert len(wheels) == 1, f"expected 1 wheel, found {wheels}"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
              for req in ("portcullis/__init__.py", "portcullis/py.typed", "portcullis/__init__.pyi"):
                  assert req in names, f"missing {req} in {wheels[0]}: {sorted(names)}"
              assert any(n.endswith("/LICENSE") or n == "LICENSE" for n in names), f"missing LICENSE in {wheels[0]}"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.91.1"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path bindings/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*

  publish-crates:
    needs: [verify, binaries, wheels, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.91.1"
      - name: Publish portcullis crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p portcullis

  publish-pypi:
    needs: [verify, binaries, wheels, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [verify, binaries, wheels, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
