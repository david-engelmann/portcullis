[package]
name = "portcullis-bindings"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "The thin Python binding over the portcullis crate, carrying no logic of its own"
license = "MIT"
repository = "https://github.com/david-engelmann/portcullis"

[lib]
name = "portcullis"
doc = false
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
portcullis-core = { package = "portcullis", path = ".." }
pyo3 = { version = "0.30", features = ["abi3-py39"] }
