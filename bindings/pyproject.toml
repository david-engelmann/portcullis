[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "portcullis"
version = "0.1.0"
description = "A local tool-call firewall that sits between an agent and your machine, allowing, denying, or rewriting shell, file, and network calls by rule, and referring the calls its rules leave open to a decision model."
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.maturin]
module-name = "portcullis._portcullis"
python-source = "../python"
