[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "portcullis"
version = "0.1.0"
description = "A local tool call gate that decides whether a proposed tool call may proceed"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.maturin]
module-name = "portcullis._portcullis"
python-source = "../python"
