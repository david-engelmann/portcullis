[workspace]
members = [".", "bindings"]
default-members = [".", "bindings"]
resolver = "2"

[package]
name = "portcullis"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
default-run = "portcullis"
description = "A local tool-call firewall that sits between an agent and your machine, allowing, denying, or rewriting shell, file, and network calls by rule, and referring the calls its rules leave open to a decision model."
license = "MIT"
readme = "README.md"
repository = "https://github.com/david-engelmann/portcullis"
homepage = "https://github.com/david-engelmann/portcullis"
documentation = "https://docs.rs/portcullis"
keywords = ["agent", "firewall", "policy", "security", "audit"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/**", "bindings/**", "python/**", "pyproject.toml", "tests/fixtures/**"]

[lib]
name = "portcullis"
path = "src/lib.rs"

[[bin]]
name = "portcullis"
path = "src/bin/portcullis.rs"

[[bin]]
name = "codepoint_scan"
path = "src/bin/codepoint_scan.rs"

[dependencies]
fs2 = "0.4"
sha2 = "0.10"
