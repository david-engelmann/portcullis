[workspace]
members = [".", "bindings"]
default-members = [".", "bindings"]
resolver = "2"

[package]
name = "portcullis"
version = "0.1.0"
edition = "2021"
description = "A local tool-call firewall that sits between an agent and your machine, allowing, denying, or rewriting shell, file, and network calls by rule, and referring the calls its rules leave open to a decision model."
license = "MIT"

[lib]
name = "portcullis"
path = "src/lib.rs"

[[bin]]
name = "portcullis"
path = "src/bin/portcullis.rs"

[[bin]]
name = "codepoint_scan"
path = "src/bin/codepoint_scan.rs"

[dependencies]
fs2 = "0.4"
sha2 = "0.10"
